<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧進銷存 Excel 預覽</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #217346; padding: 20px; display: flex; justify-content: center; }
        .excel-window {
            width: 1000px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }
        .ribbon { background: #f3f3f3; padding: 10px; border-bottom: 1px solid #ddd; display: flex; gap: 20px; }
        .ribbon-item { color: #444; font-size: 14px; cursor: pointer; }
        .ribbon-item.active { color: #217346; font-weight: bold; border-bottom: 2px solid #217346; }
        
        .formula-bar { background: white; padding: 5px 10px; border-bottom: 1px solid #ddd; display: flex; align-items: center; color: #555; }
        .fx { font-weight: bold; color: #999; margin-right: 10px; }
        .formula-input { flex-grow: 1; border: none; outline: none; font-family: monospace; }

        .sheet { padding: 20px; background: #fff; flex-grow: 1; }
        
        /* Dashboard Area */
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { padding: 15px; border-radius: 8px; color: white; text-align: center; }
        .card h3 { margin: 0; font-size: 14px; opacity: 0.9; }
        .card .value { font-size: 28px; font-weight: bold; margin-top: 5px; }
        
        .bg-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .bg-green { background: linear-gradient(135deg, #10b981, #047857); }
        .bg-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .bg-orange { background: linear-gradient(135deg, #f59e0b, #b45309); }

        /* Data Table */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8f9fa; text-align: left; padding: 12px; border-bottom: 2px solid #ddd; color: #666; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f1f5f9; }
        
        .status-ok { color: #10b981; font-weight: bold; background: #d1fae5; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-low { color: #ef4444; font-weight: bold; background: #fee2e2; padding: 2px 8px; border-radius: 10px; font-size: 12px; }

        /* Tabs Footer */
        .tabs { background: #f3f3f3; padding: 5px 10px; display: flex; gap: 5px; border-top: 1px solid #ddd; }
        .tab { padding: 5px 15px; background: white; border-radius: 4px 4px 0 0; color: #217346; font-weight: bold; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .tab.inactive { background: transparent; color: #666; box-shadow: none; }

        /* Interactive Elements */
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        .btn-action { background: #217346; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        .btn-action:hover { background: #1e6b41; }

        /* Container for Download Button */
        .download-container {
            text-align:center; margin-bottom:20px;
        }
        .download-btn {
            background:#d00; color:white; padding:15px 30px; text-decoration:none; 
            font-weight:bold; border-radius:5px; font-size:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: inline-block;
        }

    </style>
</head>
<body>

    <div class="excel-window">
        <!-- Ribbon -->
        <div class="ribbon">
            <div class="ribbon-item">檔案</div>
            <div class="ribbon-item active">常用</div>
            <div class="ribbon-item">插入</div>
            <div class="ribbon-item">版面配置</div>
            <div class="ribbon-item">公式</div>
            <div class="ribbon-item">資料</div>
        </div>

        <!-- Formula Bar -->
        <div class="formula-bar">
            <span class="fx">fx</span>
            <input type="text" class="formula-input" id="formula-display" value="=SUM(E2:E100)" readonly>
        </div>

        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="sheet content-section active">
            <h2 style="color:#217346; margin-top:0;">📊 工廠戰情室 - 庫存總覽 (系統展示)</h2>
            
            <div class="dashboard">
                <div class="card bg-blue">
                    <h3>總庫存品項</h3>
                    <div class="value" id="val-items">5</div>
                </div>
                <div class="card bg-green">
                    <h3>本月入庫數</h3>
                    <div class="value" id="val-in">850</div>
                </div>
                <div class="card bg-orange">
                    <h3>本月出庫數</h3>
                    <div class="value" id="val-out">620</div>
                </div>
                <div class="card bg-red">
                    <h3>⚠️ 缺貨預警</h3>
                    <div class="value" id="val-alert">1</div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>料號</th>
                        <th>品名</th>
                        <th>規格</th>
                        <th>安全庫存</th>
                        <th>目前庫存</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody id="inventory-table">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- INBOUND TAB -->
        <div id="tab-inbound" class="sheet content-section">
            <h2 style="color:#217346;">📥 入庫作業單</h2>
            <div style="max-width: 400px; background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 0 auto;">
                <div class="input-group">
                    <label>選擇料號</label>
                    <select id="in-sku">
                        <option value="A-001">A-001 鍍鋅鋼板</option>
                        <option value="B-105">B-105 工業用螺絲</option>
                        <option value="C-099">C-099 防護手套</option>
                        <option value="D-302">D-302 切削油</option>
                        <option value="E-001">E-001 包裝紙箱</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>入庫數量</label>
                    <input type="number" id="in-qty" placeholder="輸入數量...">
                </div>
                <button class="btn-action" onclick="handleInbound()">確認入庫</button>
            </div>
        </div>

        <!-- OUTBOUND TAB -->
        <div id="tab-outbound" class="sheet content-section">
            <h2 style="color:#d9534f;">📤 出庫作業單</h2>
            <div style="max-width: 400px; background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 0 auto;">
                <div class="input-group">
                    <label>選擇料號</label>
                    <select id="out-sku">
                        <option value="A-001">A-001 鍍鋅鋼板</option>
                        <option value="B-105">B-105 工業用螺絲</option>
                        <option value="C-099">C-099 防護手套</option>
                        <option value="D-302">D-302 切削油</option>
                        <option value="E-001">E-001 包裝紙箱</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>出庫數量</label>
                    <input type="number" id="out-qty" placeholder="輸入數量...">
                </div>
                <button class="btn-action" style="background:#d9534f;" onclick="handleOutbound()">確認出庫</button>
            </div>
        </div>

        <!-- Tabs Footer -->
        <div class="tabs">
            <div class="tab" onclick="switchTab('dashboard')" id="btn-dashboard">儀表板</div>
            <div class="tab inactive" onclick="switchTab('inbound')" id="btn-inbound">入庫單</div>
            <div class="tab inactive" onclick="switchTab('outbound')" id="btn-outbound">出庫單</div>
            <div class="tab inactive" onclick="alert('進階功能：付費版解鎖')">參數設定 🔒</div>
        </div>
    </div>

    <script>
        // Mock Data
        const db = {
            'A-001': { name: '鍍鋅鋼板', spec: '2mm x 100cm', safe: 500, stock: 1200 },
            'B-105': { name: '工業用螺絲', spec: 'M5 x 20mm', safe: 10000, stock: 25000 },
            'C-099': { name: '防護手套', spec: 'L Size', safe: 200, stock: 50 }, // Low
            'D-302': { name: '切削油', spec: '50L 桶裝', safe: 10, stock: 15 },
            'E-001': { name: '包裝紙箱', spec: '50x50x50', safe: 100, stock: 98 } // Low
        };

        function renderTable() {
            const tbody = document.getElementById('inventory-table');
            tbody.innerHTML = '';
            let alertCount = 0;
            let totalItems = 0;

            for (const [sku, item] of Object.entries(db)) {
                totalItems++;
                const isLow = item.stock < item.safe;
                if (isLow) alertCount++;
                
                const statusHtml = isLow 
                    ? `<span class="status-low">補貨中</span>` 
                    : `<span class="status-ok">正常</span>`;
                
                const stockStyle = isLow ? 'color:red; font-weight:bold;' : '';

                const row = `
                    <tr>
                        <td>${sku}</td>
                        <td>${item.name}</td>
                        <td>${item.spec}</td>
                        <td>${item.safe}</td>
                        <td style="${stockStyle}">${item.stock}</td>
                        <td>${statusHtml}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
            
            document.getElementById('val-items').innerText = totalItems;
            document.getElementById('val-alert').innerText = alertCount;
        }

        function switchTab(tabName) {
            // Hide all
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.add('inactive'));
            
            // Show target
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('btn-' + tabName).classList.remove('inactive');
            
            // Update formula bar mock
            const formulas = {
                'dashboard': '=SUM(E2:E100)',
                'inbound': '=IF(B2>0, "Valid", "Error")',
                'outbound': '=VLOOKUP(A2, Inventory!A:D, 4, 0)'
            };
            document.getElementById('formula-display').value = formulas[tabName] || '';
            
            if(tabName === 'dashboard') renderTable();
        }

        function handleInbound() {
            const sku = document.getElementById('in-sku').value;
            const qty = parseInt(document.getElementById('in-qty').value);
            if (!qty || qty <= 0) return alert('請輸入有效數量');
            
            db[sku].stock += qty;
            document.getElementById('val-in').innerText = parseInt(document.getElementById('val-in').innerText) + qty;
            
            alert(`✅ 成功入庫！\n料號：${sku}\n數量：${qty}\n目前庫存：${db[sku].stock}`);
            document.getElementById('in-qty').value = '';
        }

        function handleOutbound() {
            const sku = document.getElementById('out-sku').value;
            const qty = parseInt(document.getElementById('out-qty').value);
            if (!qty || qty <= 0) return alert('請輸入有效數量');
            
            if (db[sku].stock < qty) return alert('❌ 庫存不足！無法出庫。');

            db[sku].stock -= qty;
            document.getElementById('val-out').innerText = parseInt(document.getElementById('val-out').innerText) + qty;
            
            alert(`✅ 成功出庫！\n料號：${sku}\n數量：${qty}\n目前庫存：${db[sku].stock}`);
            document.getElementById('out-qty').value = '';
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
